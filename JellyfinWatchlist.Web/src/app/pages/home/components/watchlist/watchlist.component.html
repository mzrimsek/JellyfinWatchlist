@if (watchlistItems && watchlistItems.length > 0) {
  <h2>Watchlist</h2>

  <ul>
    @for (item of watchlistItems; track item.id) {
      <app-shared-media-item [item]="item" [isPartOfWatchlist]="true" (itemSelected)="itemSelected.emit($event)"></app-shared-media-item>
    }
  </ul>
} @else {
  <p>No items in watchlist</p>
}
