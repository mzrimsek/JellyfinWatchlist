<app-shared-layout>
  <h1>Welcome {{ username$ | async }}!</h1>
  <app-shared-media-item-list
    [items]="(watchlistItems$ | async) ?? []"
    [watchlistIds]="(watchlistIds$ | async) ?? []"
    (itemSelected)="removeItem($event)">
    <ng-container>{{ watchlistHeader$ | async }}</ng-container>
  </app-shared-media-item-list>
</app-shared-layout>
