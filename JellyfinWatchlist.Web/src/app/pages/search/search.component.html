<app-shared-layout>
  @if (searchForm) {
    <div class="search-page">
      <app-search-form [group]="searchForm" (search)="search()"></app-search-form>
      <app-search-results-list
        [results]="(searchResults$ | async) ?? []"
        [watchlistIds]="(watchlistIds$ | async) ?? []"
        (itemSelected)="selectItem($event)"></app-search-results-list>
    </div>
  }
</app-shared-layout>
