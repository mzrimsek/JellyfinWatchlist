<mat-card>
  <mat-card-content>
    @if (results.length === 0) {
      <p>No results found.</p>
    } @else {
      <div class="result-list">
        <div class="list-header">
          <p>{{ results.length }} results</p>
        </div>
        <div class="items">
          @for (mediaItem of results; track mediaItem.id) {
            <div class="item">
              <app-shared-media-item
                [item]="mediaItem"
                [isPartOfWatchlist]="itemIsPartOfWatchlist(mediaItem)"
                (itemSelected)="itemSelected.emit($event)"></app-shared-media-item>
            </div>
          }
        </div>
      </div>
    }
  </mat-card-content>
</mat-card>
