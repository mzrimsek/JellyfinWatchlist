@if (results.length === 0) {
<p>No results found.</p>
} @else {
<div class="result-list">
  @for (resultItem of results; track resultItem.id) {
  <div class="result-item">
    <div>{{ resultItem.name }} ({{ resultItem.year }})</div>
    <img src="{{ resultItem.primaryImageUrl }}" alt="{{ resultItem.name }}" />
  </div>
  }
</div>
}
