name: Web CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'JellyfinWatchlist.Web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'JellyfinWatchlist.Web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  test:
    name: Test Web Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./JellyfinWatchlist.Web

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./JellyfinWatchlist.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Run tests with coverage
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build application
        run: npm run build

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage-node-${{ matrix.node-version }}
          path: ./JellyfinWatchlist.Web/coverage/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results-node-${{ matrix.node-version }}
          path: |
            ./JellyfinWatchlist.Web/test-results/
            ./JellyfinWatchlist.Web/karma.log
          retention-days: 7

  build:
    name: Build Web Application
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: ./JellyfinWatchlist.Web

    strategy:
      matrix:
        environment: [development, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ./JellyfinWatchlist.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for ${{ matrix.environment }}
        run: |
          if [ "${{ matrix.environment }}" = "production" ]; then
            npm run build
          else
            npm run build -- --configuration=development
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ matrix.environment }}
          path: ./JellyfinWatchlist.Web/dist/
          retention-days: 7

  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./JellyfinWatchlist.Web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ./JellyfinWatchlist.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript compilation
        run: npx tsc --noEmit

      - name: Check formatting
        run: npm run format:check
