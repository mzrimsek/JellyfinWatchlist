name: API CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "JellyfinWatchlist.Api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "JellyfinWatchlist.Api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./JellyfinWatchlist.Api

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ./JellyfinWatchlist.Api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-test-results-node-${{ matrix.node-version }}
          path: |
            ./JellyfinWatchlist.Api/coverage/
            ./JellyfinWatchlist.Api/test-results/
          retention-days: 7

  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: ./JellyfinWatchlist.Api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: ./JellyfinWatchlist.Api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./JellyfinWatchlist.Api/dist/
          retention-days: 7
