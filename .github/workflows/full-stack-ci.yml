name: Full Stack CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'JellyfinWatchlist.Api/**'
            web:
              - 'JellyfinWatchlist.Web/**'
            workflows:
              - '.github/workflows/**'

  api-health:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.workflows == 'true' }}

    defaults:
      run:
        working-directory: ./JellyfinWatchlist.Api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: ./JellyfinWatchlist.Api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Check outdated packages
        run: npm outdated || true

      - name: Quick test run
        run: npm run test -- --testTimeout=30000

  web-health:
    name: Web Health Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.workflows == 'true' }}

    defaults:
      run:
        working-directory: ./JellyfinWatchlist.Web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: ./JellyfinWatchlist.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Check outdated packages
        run: npm outdated || true

      - name: Quick test run
        run: npm run test -- --watch=false --browsers=ChromeHeadless --progress=false

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [api-health, web-health]
    if: ${{ always() && (needs.api-health.result == 'success' || needs.api-health.result == 'skipped') && (needs.web-health.result == 'success' || needs.web-health.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install API dependencies
        run: |
          cd JellyfinWatchlist.Api
          npm ci

      - name: Install Web dependencies
        run: |
          cd JellyfinWatchlist.Web
          npm ci

      - name: Start API server
        run: |
          cd JellyfinWatchlist.Api
          npm run build
          npm run start:prod &
          sleep 10
        env:
          JELLYFIN_INSTANCE: http://localhost:8096
          CONFIG_PATH: ./config

      - name: Build Web application
        run: |
          cd JellyfinWatchlist.Web
          npm run build

      - name: Test API health endpoint
        run: |
          curl -f http://localhost:3000/health || exit 1

      - name: Stop API server
        run: pkill -f "node.*dist/main.js" || true

  status-check:
    name: Overall Status
    runs-on: ubuntu-latest
    needs: [api-health, web-health, integration]
    if: always()

    steps:
      - name: Check overall status
        run: |
          echo "API Health: ${{ needs.api-health.result }}"
          echo "Web Health: ${{ needs.web-health.result }}"
          echo "Integration: ${{ needs.integration.result }}"

          if [[ "${{ needs.api-health.result }}" == "failure" ]] || [[ "${{ needs.web-health.result }}" == "failure" ]] || [[ "${{ needs.integration.result }}" == "failure" ]]; then
            echo "❌ Some checks failed"
            exit 1
          else
            echo "✅ All checks passed"
          fi
